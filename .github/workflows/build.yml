name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-

    - name: Build Debug APK
      run: ./gradlew :core:app:assembleDebug --no-daemon
      env:
        SIGNING_STORE_PASSWORD: ""
        SIGNING_KEY_PASSWORD: ""

    - name: Upload Debug APK (arm64)
      uses: actions/upload-artifact@v4
      with:
        name: debug-arm64-v8a
        path: core/app/build/outputs/apk/debug/*arm64-v8a*debug*.apk

    - name: Upload Debug APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: debug-armeabi-v7a
        path: core/app/build/outputs/apk/debug/*armeabi-v7a*debug*.apk

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: ACS Lit Pro v1.0.0
        body: |
          ## ACS Lit Pro v1.0.0
          
          First build with package name `com.ACSlit.pro`.
          
          ### Changes:
          - Renamed package from `com.tom.rv2ide` to `com.ACSlit.pro`
          - Forked from Android Code Studio
        files: |
          core/app/build/outputs/apk/debug/*arm64-v8a*debug*.apk
          core/app/build/outputs/apk/debug/*armeabi-v7a*debug*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
